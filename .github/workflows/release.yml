# Builds cava.exe on every version tag (v*) and attaches it to a GitHub
# Release with auto-generated release notes.
#
# The project is Windows-only (WASAPI / golang.org/x/sys/windows), so the
# job runs natively on a Windows runner — vet and unit tests can actually
# execute there (cross-compiling from Linux cannot run Windows tests).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Build (windows/amd64)
        run: |
          go build -trimpath `
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" `
            -o cava.exe ./cmd/cava
          .\cava.exe -version

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cava.exe
          generate_release_notes: true

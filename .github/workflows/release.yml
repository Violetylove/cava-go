# Builds cava.exe on every version tag (v*) and attaches it to a GitHub
# Release with auto-generated release notes.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      # Pure-Go project (no cgo): cross-compile the Windows binary on Linux.
      - name: Build (windows/amd64)
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o cava.exe ./cmd/cava
          ./cava.exe -version

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cava.exe
          generate_release_notes: true

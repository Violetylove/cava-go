# Builds cava.exe and cava-linux on every version tag (v*) and attaches
# them to a GitHub Release with auto-generated release notes.
#
# Two native jobs (windows-latest, ubuntu-latest) run vet and unit tests
# on their own platforms. The ubuntu job additionally cross-compiles the
# Windows target with CGO_ENABLED=0 — the whole project is cgo-free, so
# cross-compilation works from any platform without libpulse-dev.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Build (windows/amd64)
        run: |
          go build -trimpath `
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" `
            -o cava.exe ./cmd/cava
          .\cava.exe -version

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cava.exe
          generate_release_notes: true

  # Cross-platform guard: the Linux backend is pure Go (no cgo, no
  # libpulse), so this job verifies vet/tests on linux natively, attaches
  # the Linux binary, and proves the no-cgo cross-compile works by
  # building the Windows target from the ubuntu runner.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify (linux/amd64)
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile windows (CGO_ENABLED=0, no cgo)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o cava-windows-cross.exe ./cmd/cava

      - name: Build (linux/amd64)
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o cava-linux ./cmd/cava

      - name: Upload Linux binary
        uses: softprops/action-gh-release@v2
        with:
          files: cava-linux

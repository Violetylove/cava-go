# Builds and attaches cava-go binaries for windows/amd64 and linux/amd64
# to a GitHub Release on every version tag (v*).
#
# - `test`: verifies vet + unit tests natively on both platforms
#   (unit tests must run on their own OS; no cgo anywhere).
# - `release`: matrix over [windows/amd64, linux/amd64] using
#   wangyoucao577/go-release-action, which cross-compiles with
#   CGO_ENABLED=0 and uploads the packaged binaries as release assets.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go vet ./...
          go test ./...

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            os: windows-latest
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and upload
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: "1.26"
          project_path: ./cmd/cava
          binary_name: cava
          ldflags: "-s -w -X main.version=${{ github.ref_name }}"
          md5sum: false
          sha256sum: true
